# 合并到 zengdeming-gateway 的 default.conf 中，并在 my-websites/compose.yaml 中挂载：
#   - /home/dutu/workspace/pace-app/certs:/etc/nginx/ssl-pace:ro
# 证书文件：
#   /home/dutu/workspace/pace-app/certs/pace.zengdeming.cn.pem
#   /home/dutu/workspace/pace-app/certs/pace.zengdeming.cn.key

server {
    listen 80;
    listen [::]:80;
    server_name pace.zengdeming.cn;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pace.zengdeming.cn;

    ssl_certificate /etc/nginx/ssl-pace/pace.zengdeming.cn.pem;
    ssl_certificate_key /etc/nginx/ssl-pace/pace.zengdeming.cn.key;

    include /etc/nginx/snippets/gzip.conf;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        set $upstream_paceapp "paceapp-api:8080";
        proxy_pass http://$upstream_paceapp;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 支持 Hermes SSE 流式对话，避免缓冲和过早超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
